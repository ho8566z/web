<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ONELINE DIARY</title>

    <link href="./css/common.css" rel="stylesheet">
    <link href="./css/index.css" rel="stylesheet">

    <script src="./js/util.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/dumy.js"></script>
    <script src="./js/menuChange.js"></script>
    <script src="./js/viewChange.js"></script>
    <script src="./js/session.js"></script>
    <script src="./js/index.js"></script>
    

</head>
<body>
    
    <div id="wrap">

        <!-- 제목 -->
        <div class="title_wrap">
            Online Diary
        </div>

        <!-- 메뉴 -->
        <div class="menu_wrap">
            <a class="sign_up" href="#none">Sign-up</a>
            <a class="sign_in" href="#none">Sign-in</a>
            <a class="sign_out" href="#none">Sign-out</a>
            <a class="delete" href="#none">Delete</a>
            <a class="write" href="#none">Write</a>
            <a class="list" href="#none">List</a>
        </div>

        <!-- 회원 가입 페이지 -->
        <div class="sign_up_wrap">
            <input class="basic_input" type="text" name="u_id" placeholder="INPUT USER ID :">
            <br>
            <input class="basic_input" type="password" name="u_pw" placeholder="INPUT USER PW :">
            <br>
            <input class="basic_input" type="text" name="u_mail" placeholder="INPUT USER MAIL :">
            <br>
            <input class="basic_button" type="button" value="SIGN UP">
        </div>

        <!-- 회원 로그인 페이지 -->
         <div class="sign_in_wrap">
            <input class="basic_input" type="text" name="u_id" placeholder="INPUT USER ID :">
            <br>
            <input class="basic_input" type="password" name="u_pw" placeholder="INPUT USER PW :">
            <br>
            <input class="basic_button" type="button" value="SIGN IM">
        </div>

        <!-- 일기 작성 페이지 -->
        <div class="write_wrap">
            <input type="text"><button>Write</button>
        </div>

        <!-- 일기 리스트 페이지 -->
        <div class="list_wrap">
            
        </div>

    </div>

</body>
</html>


<template id="list_item">
    <div class="txt">
        
    </div>
</template>
    <!-- <template>은 HTML에서 **“화면에 바로 렌더링되지 않는 HTML 조각을 저장해두는 태그
        -> 미리 만들어 둔 UI 틀(템플릿)을 필요할 때 복제해서 쓰는 기능 -->
