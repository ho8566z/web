<!-- 
// 연산자
// 산술연산자
console.log(10 + 20);   // 30
console.log(10 - 20);   // -10
console.log(10 * 20);   // 200
console.log(10 / 20);   // 0.5
console.log(10 % 20);   // 10


// 대입 연산자, 복합대입연산자
num = 10;
num += 10;
num -= 10;
num *= 10;
num /= 10;
num %= 10;


// 비교연산자
console.log(10 > 20);   // false
console.log(10 >= 20);  // false
console.log(10 < 20);   // true
console.log(10 <= 20);  // true
console.log(10 == 20);  // false
console.log(10 != 20);  // true

let num1 = 10;
let num2 = '10';
console.log('num1 == num2: ' ,num1 == num2)
// num1 == num2:  true

console.log('num1 != num2: ' ,num1 != num2)
// num1 != num2:  false

console.log('num1 === num2: ' ,num1 === num2)
// num1 === num2:  false

console.log('num1 !== num2: ' ,num1 !== num2)
// num1 !== num2:  true


// 논리연산자
// & -> and
console.log(true && true);      // true
console.log(true && false);     // false
console.log(false && true);     // false
console.log(false && false);    // false

// || -> or
console.log(true || true);      // true
console.log(true || false);     // true
console.log(false || true);     // true
console.log(false || false);    // false

// ! -> not
console.log(!true);      // false
console.log(!false);     // true


// 증감연산자
let myScore = 80;
console.log('myScore: ', myScore);  // myScore:  80

// myScore += 1;
myScore++;
console.log('myScore: ', myScore);  // myScore:  81

myScore--;
console.log('myScore: ', myScore);  // myScore:  80


var temp = myScore--;
console.log('temp: ', temp);    // temp:  80
// 할당연산자가 증감연산자보다 우선하기 때문에, 
// 먼저 temp에 myScore를 할당한 다음에, myScore에 증감이 일어남

myScore = 80;
temp = --myScore;
console.log('temp: ', temp);    // temp:  79
// 위와 같이 증감연산자의 위치를 바꾸면, 할당연산자 보다 우선순위를 
// 가지기 때문에 temp의 값이 증감이 일어난 다음의 값을 할당한다

// -> myScore--: 후위 증감연산자 / ++myScore: 전위 증감연산자


// 삼항(조건식) 연산자
// status = 'success' if myScore > 80 else 'fail'

let score = 85;
let grade = score >= 90 ? 'A' : 'B';
console.log('grade: ', grade)   // grade:  B

let score = 95;
let grade = score >= 90 ? 'A' : 'B';
console.log('grade: ', grade)   // grade:  A
