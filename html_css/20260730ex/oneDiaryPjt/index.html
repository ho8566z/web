<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OnelineDiaryPjt</title>

    <link href="./css/common.css" rel="stylesheet" type="text/css">
    <link href="./css/index.css" rel="stylesheet" type="text/css">

    <script src="./js/index.js" type="module"></script>

</head>
<body>
    
    <div id="wrap">
        <!-- 제목 -->
        <div class="title_wrap">
            Oneline Diary
        </div>

        <!-- 메뉴 -->
        <div class="menu_wrap">
            <a class="Sign-up" href="#none">Sign-up</a>
            <a class="Sign-in" href="#none">Sign-in</a>
            <a class="Sign-out" href="#none">Sign-out</a>
            <a class="Write" href="#none">Write</a>
            <a class="List" href="#none">List</a>
        </div>

        <!-- 회원가입 화면 -->
        <div class="sign_up_wrap">
            <input type="text" name="u_id" placeholder="Input new user ID">
            <br>
            <input type="text" name="u_pw" placeholder="Input new user PW">
            <br>
            <input type="email" name="u_mail" placeholder="Input new user MAIL">
            <br>
            <input type="button" value="SIGN UP">
        </div>

        <!-- 로그인 화면 -->
        <div class="sign_in_wrap">
            <input type="text" name="u_id" placeholder="Input user ID">
            <br>
            <input type="text" name="u_pw" placeholder="Input user PW">
            <br>
            <input type="button" value="SIGN IN">
        </div>

        <!-- 일기 쓰기 회면 -->
        <div class="write_wrap">
            <input type="text"><button>WRITE</button>
        </div>

        <!-- 일기 목록 화면 -->
        <div class="list_wrap">

        </div>
    </div>

</body>
</html>
